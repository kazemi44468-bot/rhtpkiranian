<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="2;url=./"><title>صفحه پیدا نشد | راهکار هوشمند تأمین، پشتیبانی و خدمات ایرانیان</title><link rel="stylesheet" href="assets/css/style.css"><link rel="icon" type="image/png" href="assets/images/logo.png"></head><body><main class="not-found"><div class="brand-mark"><img src="assets/images/logo.png" alt="لوگوی شرکت"></div><div class="eyebrow">خطای مسیر</div><h1>صفحه موردنظر پیدا نشد</h1><p>این مسیر وجود ندارد یا جابه‌جا شده است. تا چند لحظه دیگر به صفحه اصلی بازمی‌گردید.</p><a class="action-btn" href="./">بازگشت به صفحه اصلی</a></main><script>(()=>{const m=document.querySelector('.page-menu');if(!m)return;const sync=()=>m.classList.toggle('is-scrolled',window.scrollY>24);sync();window.addEventListener('scroll',sync,{passive:true})})();</script><script>(function(){document.querySelectorAll('.page-menu nav.home-page-nav').forEach(function(nav){let down=false,startX=0,startScroll=0,moved=false;nav.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;down=true;moved=false;startX=e.clientX;startScroll=nav.scrollLeft;nav.classList.add('is-dragging');if(nav.setPointerCapture){try{nav.setPointerCapture(e.pointerId)}catch(_){}}},{passive:true});nav.addEventListener('pointermove',function(e){if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>3)moved=true;if(moved)nav.scrollLeft=startScroll-dx},{passive:true});['pointerup','pointercancel','lostpointercapture'].forEach(function(type){nav.addEventListener(type,function(){down=false;nav.classList.remove('is-dragging')},{passive:true})});nav.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false}},true)})})();</script></body></html>
